<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBL Card Maker Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Padauk:wght@400;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <header>
            <h3>BBL Slip Maker</h3>
        </header>

        <div class="preview-box">
            <canvas id="cardCanvas" width="1000" height="600" style="display:none;"></canvas>
            
            <img id="resultImage" src="" alt="Preview Loading...">
            
            <div id="loadingMessage">Generating Preview...</div>
        </div>
        
        <p class="hint">ပုံကို save ရန် ပုံပေါ်တွင် ဖိနှိပ်ထားပါ (Long press to save)</p>
        <button class="btn-force-update" onclick="forceUpdate()">ပုံမပေါ်လျှင် နှိပ်ပါ (Refresh)</button>

        <div class="controls">
            
            <label>ဒီဇိုင်း (Style)</label>
            <select id="styleSelect" onchange="render()">
                <option value="bbl_original">BBL Original (ပုံပါအတိုင်း)</option>
                <option value="modern">Modern Style</option>
                <option value="minimal">Minimal Style</option>
            </select>

            <label>အမည် (Name)</label>
            <input type="text" id="nameInput" value="MR. TINT AUNG KHAING" oninput="render()">

            <label>အကောင့်နံပါတ် (Account No)</label>
            <input type="text" id="acctInput" value="123-456-7890" oninput="render()">

            <label>Logo ပြောင်းရန် (Optional)</label>
            <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload(this)">
            
            <div class="color-picker-group">
                <label>Theme Color:</label>
                <input type="color" id="themeColor" value="#1e4598" oninput="render()">
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
