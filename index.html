<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Bank Card Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Thai Bank Card Maker</h1>
            <p>ငွေလွှဲ Account ကဒ် ဒီဇိုင်းပြုလုပ်ရန်</p>
        </header>

        <div class="card-preview-container">
            <canvas id="cardCanvas" style="display:none;"></canvas>
            
            <img id="resultImage" src="" alt="Preview will appear here" style="display:none;">
            <div id="placeholderText">
                <p>အောက်တွင် အချက်အလက်များ ဖြည့်ပါ</p>
            </div>
        </div>

        <div class="form-control">
            
            <label>ဘဏ် ရွေးချယ်ရန် (Bank)</label>
            <div class="bank-grid" id="bankGrid">
                </div>

            <label>ဒီဇိုင်း ပုံစံ (Design Layout)</label>
            <select id="themeSelect" onchange="triggerUpdate()">
                <option value="modern_card">Standard Card (သာမန်ကဒ်)</option>
                <option value="social_post">Social Media Post (Instagram/FB)</option>
                <option value="business_cover">Business Cover (Official)</option>
                <option value="minimalist">Minimalist (ရိုးရှင်းသန့်ပြန့်)</option>
            </select>

            <label>အမည် (Name)</label>
            <input type="text" id="nameInput" placeholder="MR. TINT AUNG KHAING" oninput="triggerUpdate()">

            <label>ဘဏ်နံပါတ် (Account No)</label>
            <input type="text" id="acctInput" placeholder="000-000-0000" oninput="triggerUpdate()" maxlength="15">

            <div class="button-group">
                <button class="btn-reset" onclick="resetForm()">ပြန်စမယ် (Reset)</button>
                <button class="btn-generate" onclick="generateImage()">ပုံထုတ်မည် (Generate)</button>
            </div>
            
            <div id="downloadSection" style="display:none;">
                <p class="fb-notice">ပုံကို ဖိနှိပ်ပြီး Save လုပ်ပါ (Long Press to Save)</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
