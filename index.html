<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bank Card Maker Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Padauk:wght@400;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="top-app-bar">
            <h3>Bank Card Maker</h3>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
        </header>

        <div class="content-body">
            
            <div class="preview-card-container">
                <div class="preview-box">
                    <canvas id="cardCanvas" width="1000" height="600" style="display:none;"></canvas>
                    <img id="resultImage" src="" alt="Card Preview">
                </div>
                
                <div class="action-buttons">
                    <button class="btn-download" onclick="downloadImage()">
                        <span class="material-symbols-outlined">download</span>
                        ပုံကို သိမ်းမည် (Download)
                    </button>
                </div>
                <p class="save-hint">Facebook တွင် Download မရပါက ညာဘက်အပေါ်ထောင့် (...) နှိပ်ပြီး "Open in Chrome/Browser" ဖြင့်ဖွင့်ပါ</p>
            </div>

            <div class="controls-panel">

                <div class="input-section">
                    <label class="section-label">၁။ ဘဏ် ရွေးချယ်ရန် (Bank)</label>
                    <div class="bank-grid" id="bankGrid"></div>
                </div>

                <div class="input-section">
                    <label class="section-label">၂။ အချက်အလက်များ</label>
                    <div class="md-input-group">
                        <input type="text" id="nameInput" placeholder=" " oninput="render()">
                        <label>အမည် (Name)</label>
                    </div>
                    <div class="md-input-group">
                        <input type="text" id="acctInput" placeholder=" " oninput="render()">
                        <label>အကောင့်နံပါတ် (Account No)</label>
                    </div>
                </div>

                <div class="input-section">
                    <label class="section-label">၃။ ဒီဇိုင်းနှင့် ဓာတ်ပုံ</label>
                    <div class="md-select-wrapper">
                        <select id="styleSelect" onchange="render()">
                            <option value="layout_bbl">BBL Original Style</option>
                            <option value="layout_gradient">Gradient Style</option>
                            <option value="layout_material">Material Style</option>
                            <option value="layout_modern">Modern Style</option>
                        </select>
                        <span class="material-symbols-outlined arrow">expand_more</span>
                    </div>

                    <div class="upload-container" onclick="document.getElementById('logoUpload').click()">
                        <div class="upload-icon">
                            <span class="material-symbols-outlined">crop_free</span>
                        </div>
                        <div class="upload-text">
                            <strong>QR / Profile ပုံတင်ရန်</strong>
                            <span>(Crop ပြုလုပ်နိုင်သည်)</span>
                        </div>
                        <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload(this)" hidden>
                    </div>
                </div>

                <button class="btn-text" onclick="resetForm()">Reset All</button>

            </div>
        </div>
    </div>

    <div id="cropModalWrapper" class="crop-modal-overlay" style="display: none;">
        <div class="crop-modal-content">
            <h3>Adjust Image</h3>
            <div class="img-container">
                <img id="imageToCrop" src="" alt="Picture">
            </div>
            <div class="crop-actions">
                <button class="btn-cancel" onclick="closeCropModal()">Cancel</button>
                <button class="btn-confirm" onclick="confirmCrop()">Crop & Use</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
